    <path d="M12 25 C13 23, 14 21, 15 20 C14 18, 14 16, 15 14 C16 12, 18 10, 20 9 C20.5 8.8, 21.5 8.5, 22 9 C22.5 9.5, 22.8 11, 23 11.5 C24 10.5, 24.5 10, 25 10.2 C25.5 10.4, 25.2 11.5, 25 12.5 C26 12, 27 12, 27.5 12.5 C27 13.5, 26 14.5, 24.5 15.5 C23 16.5, 22 17, 21.5 18 C20.5 20, 20 22, 20 24 C19 25, 17 26, 15 26 C13.5 26, 12.5 25.5, 12 25 Z" fill="#00A859"/>
