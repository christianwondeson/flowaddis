<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" fill="none">
  <!-- Card background in traditional taxi yellow -->
  <rect width="160" height="50" rx="10" fill="#FFCC00"/>
  <!-- Dark green / blue accent stripe with checker pattern -->
  <rect x="0" y="38" width="160" height="12" rx="0" fill="#003366"/>
  <!-- Taxi rooftop sign icon -->
  <g transform="translate(10, 8)">
    <rect x="2" y="5" width="28" height="16" rx="4" fill="#FFFFFF" stroke="#003366" stroke-width="2"/>
    <path d="M4 21 L28 21 L26 25 L6 25 Z" fill="#003366"/>
    <text x="16" y="17" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="7" fill="#003366" text-anchor="middle" letter-spacing="0.5">TAXI</text>
  </g>
  <!-- METER TAXI / ሜትር ታክሲ text -->
  <text x="46" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#003366" letter-spacing="0.5">METER TAXI</text>
  <text x="46" y="34" font-family="'Noto Sans Ethiopic', system-ui, sans-serif" font-weight="800" font-size="11" fill="#003366">ሜትር ታክሲ</text>
  <!-- Shortcode badge (6303 / City Fleet) -->
  <rect x="117" y="11" width="35" height="20" rx="5" fill="#003366"/>
  <text x="134.5" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9.5" fill="#FFCC00" text-anchor="middle" letter-spacing="0.5">6303</text>
</svg>

